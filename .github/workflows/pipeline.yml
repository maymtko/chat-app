name: CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with pyright
        run: pyright

      - name: Test
        env:
          FIREBASE_CREDENTIALS: '{"type":"service_account"}'
          FIREBASE_API_KEY: test-key
          APP_SECRET: test-secret
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag chatapp-backend:test

  deploy:
      name: Deploy Backend to Cloud Run
      runs-on: ubuntu-latest
      needs: [backend, frontend] # Only deploys if both jobs succeed
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on push to main

      defaults:
        run:
          working-directory: backend

      permissions:
        contents: read
        id-token: write

      steps:
        - uses: actions/checkout@v4

        - name: Authenticate to Google Cloud
          uses: google-github-actions/auth@v2
          with:
            workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
            service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

        - name: Set up Cloud SDK
          uses: google-github-actions/setup-gcloud@v2

        - name: Create env.yaml from Secret
          run: |
            echo "${{ secrets.ENV_YAML }}" > env.yaml

        - name: Deploy to Cloud Run
          run: |
            gcloud run deploy chatapp-backend \
              --source . \
              --region us-central1 \
              --port 8000 \
              --allow-unauthenticated \
              --env-vars-file env.yaml        